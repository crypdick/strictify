version = 2
# Same shipped toolkit used by target repositories, with no application layers.
source_roots = [{ path = ".", module = "" }]
stdlib_only = true
check_package_cycles = true
standalone_modules = [
  "skills.strictify.scripts.check_exception_handling",
  "skills.strictify.scripts.check_file_length",
  "skills.strictify.scripts.check_private_test_imports",
  "skills.strictify.scripts.check_timeless_comments",
  "tools.check_category_count",
  "tools.prepare_plugin_release",
  "tests",
  "tests.test_architecture",
  "tests.test_hook_cli",
  "tests.test_hook_scripts",
  "tests.test_shipped_policy",
]

[dynamic_loading]
"tests.test_hook_scripts" = "Load standalone hooks by source path to exercise public functions."

[roles.hook]
allowed_dependencies = []
[roles.toolkit]
allowed_dependencies = []
[roles.tool]
allowed_dependencies = []
[roles.test]
allowed_dependencies = []

[[packages]]
name = "exception_hook"
root = "skills.strictify.scripts.check_exception_handling"
role = "hook"
public_modules = []
include_descendants = false

[[packages]]
name = "file_length_hook"
root = "skills.strictify.scripts.check_file_length"
role = "hook"
public_modules = []
include_descendants = false

[[packages]]
name = "private_test_hook"
root = "skills.strictify.scripts.check_private_test_imports"
role = "hook"
public_modules = []
include_descendants = false

[[packages]]
name = "timeless_hook"
root = "skills.strictify.scripts.check_timeless_comments"
role = "hook"
public_modules = []
include_descendants = false

[[packages]]
name = "architecture_toolkit"
root = "skills.strictify.scripts.architecture"
role = "toolkit"
public_modules = ["skills.strictify.scripts.architecture.api"]
include_descendants = true

[[packages]]
name = "category_check"
root = "tools.check_category_count"
role = "tool"
public_modules = []
include_descendants = false

[[packages]]
name = "plugin_release"
root = "tools.prepare_plugin_release"
role = "tool"
public_modules = []
include_descendants = false

[[packages]]
name = "tests"
root = "tests"
role = "test"
public_modules = []
include_descendants = true
