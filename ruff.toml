# Ruff config for this repo's own Python — the six stdlib-only pre-commit hook
# scripts under skills/strictify/scripts/ (the only .py in the repo).
#
# Mirrors the strict config strictify ships in
# skills/strictify/references/pyproject-strict.md, so the plugin's own payloads
# pass the exact bar the plugin enforces on target repos.

line-length = 110
preview = true

[lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DOC102",
    "DOC202",
    "DOC403",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FA",
    "FBT",
    "G",
    "I",
    "LOG",
    "N",
    "PGH",
    "PIE",
    "PLC",
    "PLE",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR1702",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY400",
    "TRY401",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "E501",   # line-length deferred to the formatter, per the shipped config
    "TRY003", # avoid exception-class ceremony for simple domain errors
]

[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
"skills/strictify/scripts/**/*.py" = ["T201"]
"tools/check_category_count.py" = ["T201"]

[format]
quote-style = "double"
