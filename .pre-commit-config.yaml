# Run with:     uvx pre-commit run --all-files
# Install hooks: uvx pre-commit install
#
# This repo is a Claude Code plugin, not a Python package: most of strictify's
# own 22 categories don't apply here (no package, no tests, no runtime). This
# config is the sensible subset that does -- repo-agnostic hygiene, ruff and mypy
# scoped to the plugin's own hook scripts, and a guard on the load-bearing
# category count. See ARCHITECTURE.md.

repos:
  # Standard file hygiene -- cheap, repo-agnostic, always worth it.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: debug-statements
      - id: mixed-line-ending

  # Ruff -- lint + format, scoped to the plugin's own hook scripts (the only
  # .py in the repo). Config lives in ruff.toml and mirrors the strict config
  # strictify ships to target repos.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix, --quiet]
        files: ^skills/strictify/scripts/
      - id: ruff-format
        args: [--quiet]
        files: ^skills/strictify/scripts/

  # mypy -- strict static typing, scoped to the plugin's own hook scripts (same
  # scope as ruff above). Config lives in mypy.ini. The scripts are payloads
  # shipped to target repos, so they hold to the strictest form of the type bar
  # strictify enforces elsewhere.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.0
    hooks:
      - id: mypy
        args: [--config-file, mypy.ini]
        files: ^skills/strictify/scripts/

  # Local guards.
  - repo: local
    hooks:
      # The "N categories" count is duplicated across SKILL.md, README.md, and
      # both plugin manifests. This fails if they drift out of sync.
      - id: check-category-count
        name: Check category count consistency
        entry: python3 tools/check_category_count.py
        language: system
        pass_filenames: false
        always_run: true
