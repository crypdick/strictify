# mypy config for the stdlib-only prek hook scripts under skills/strictify/scripts/.
# Like ruff.toml, this is a standalone file because this plugin repo has no
# Python package or pyproject.toml.
#
# strictify ships `disable_error_code = ["no-untyped-call", "no-untyped-def"]` as a
# default for target repos (see references/pyproject-strict.md). The bundled
# scripts are fully typed and checked without those exceptions.

[mypy]
strict = True
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
pretty = True
