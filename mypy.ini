# mypy config for this repo's own Python — the stdlib-only pre-commit hook
# scripts under skills/strictify/scripts/ (the payloads strictify ships to target
# repos). Standalone file, mirroring ruff.toml, to keep the deliberate
# no-pyproject.toml stance (this repo is a plugin, not a package).
#
# strictify ships `disable_error_code = ["no-untyped-call", "no-untyped-def"]` as a
# pragmatic default for target repos (see references/pyproject-strict.md). The
# plugin's own payloads carry no such exceptions: they are fully typed so they pass
# the strictest form of the bar they enforce elsewhere.

[mypy]
strict = True
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
pretty = True
