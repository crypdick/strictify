# mypy config for stdlib-only hook scripts and repository checks under tools/.
# Like ruff.toml, this is a standalone file because this plugin repo has no
# Python package or pyproject.toml.
#
# The bundled scripts use the strict defaults shipped to target repositories.

[mypy]
strict = True
warn_return_any = True
warn_unused_configs = True
show_error_codes = True
pretty = True
